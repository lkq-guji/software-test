{% if error %}<div class="alert alert-error" role="alert" data-testid="{{ error_testid|default('booking-error') }}" data-error-code="{{ error.code }}" data-field="{{ error.field }}">
  <strong>{{ error_title|default('操作未完成') }}</strong><p><code>{{ error.code }}</code> · {{ error.message }}</p>
</div>{% endif %}
