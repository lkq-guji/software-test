[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-venue-testing"
version = "1.0.0"
description = "校园运动场馆预约与计费系统：软件测试课程项目"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "Flask>=3,<4"]
web = ["Flask>=3,<4"]

[tool.setuptools.packages.find]
include = ["venue_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["venue_app"]
